[package]
name = "herdr-a2a-cli"
version = "0.1.6"
edition.workspace = true
license.workspace = true

[features]
default = []
test-harness = []

[[bin]]
name = "herdr-a2a"
path = "src/main.rs"

[[test]]
name = "coordinator"
path = "tests/coordinator.rs"
required-features = ["test-harness"]

[[test]]
name = "managed_install"
path = "tests/managed_install.rs"
required-features = ["test-harness"]

[dependencies]
a2a.workspace = true
a2a-client.workspace = true
async-trait.workspace = true
axum.workspace = true
base64.workspace = true
clap.workspace = true
crossterm = "0.29"
futures.workspace = true
getrandom.workspace = true
herdr-a2a-broker = { path = "../herdr-a2a-broker" }
herdr-a2a-core = { path = "../herdr-a2a-core" }
hmac.workspace = true
reqwest.workspace = true
rusqlite.workspace = true
rustix = { version = "1", features = ["event", "fs", "process"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
subtle.workspace = true
tokio = { workspace = true, features = ["io-std", "io-util", "net", "process", "signal", "time"] }
toml.workspace = true

[dev-dependencies]
herdr-a2a-broker = { path = "../herdr-a2a-broker", features = ["test-support"] }
tempfile = "3"
tokio = { workspace = true, features = ["test-util"] }
